name: Validate installed Linux updates
on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
permissions:
  contents: write # Draft releases require push access even for downloads.
jobs:
  installed-update:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [AppImage, deb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2
      - run: npm run build
      - name: Build isolated earlier-version fixture
        env:
          PACKAGE: ${{ matrix.package }}
        run: npx electron-builder --linux "$PACKAGE" --x64 --publish never -c.extraMetadata.version=5.8.4-test.7 -c.directories.output=dist/baseline
      - name: Download actual candidate from draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --repo Everything-Design/ZenState --pattern '*.AppImage' --pattern '*.deb' --pattern latest-linux.yml --dir candidate
      - name: Prepare baseline installation
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ "$PACKAGE" = deb ]; then
            sudo apt-get install -y ./dist/baseline/*.deb
          else
            cp dist/baseline/*.AppImage dist/baseline/ZenState.AppImage
            chmod +x dist/baseline/ZenState.AppImage
            (cd dist/baseline && ./ZenState.AppImage --appimage-extract > /dev/null)
          fi
      - name: Verify native update and retained data
        env:
          PACKAGE: ${{ matrix.package }}
        run: xvfb-run -a node scripts/check-linux-update.cjs candidate "$PACKAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.package }}-installed-update-evidence
          path: update-evidence/
